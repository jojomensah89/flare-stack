name: Quality Matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality check
        run: bun check

      - name: Build reference project
        run: bun run build

      - name: Verify lifecycle and packed generator
        run: |
          bun packages/flare/scripts/verify-host-discovery.ts
          bun run --cwd packages/flare verify
          bun run --cwd packages/create-flare-stack verify:planner
          bun run --cwd packages/create-flare-stack verify:packed

      - name: Full acceptance for 14 app/fullstack/worker/extension profiles (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          release_dir="${RUNNER_TEMP}/flare-release"
          bun run release:prepare -- --quiet --out-dir "$release_dir"
          bun run --cwd packages/create-flare-stack verify:fixtures --flare-package "$release_dir/flare-0.14.1.tgz"

      - name: Full acceptance for 14 app/fullstack/worker/extension profiles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "flare-release"
          bun run release:prepare -- --quiet --out-dir "$releaseDir"
          $flareArchive = Join-Path $releaseDir "flare-0.14.1.tgz"
          bun run --cwd packages/create-flare-stack verify:fixtures --flare-package "$flareArchive"
